<!-- Card principal del diálogo -->
<div class="card shadow-lg p-3"
  style="background-color: #FDFDFD; color: var(--color-fondo-oscuro); border-radius: 1rem; max-width: 700px; width: 100%;">

  <!-- Header del diálogo -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0" style="color: var(--color-primario);">
      <ng-container *ngIf="!editMode">
        {{ player.nombre }} {{ player.apellidos }}
      </ng-container>
      <ng-container *ngIf="editMode">
        Editar Jugador
      </ng-container>
    </h2>

    <!-- Botones del header -->
    <div class="d-flex gap-2">
      <button *ngIf="!editMode" class="btn btn-editar" (click)="toggleEdit()">Editar jugador</button>
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="dialogRef.close()">×</button>
    </div>
  </div>

  <!-- ===================== -->
  <!--  FORMULARIO DE EDICIÓN -->
  <!-- ===================== -->
  <form *ngIf="editMode" [formGroup]="form" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" formControlName="nombre" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Apellidos</label>
        <input type="text" class="form-control" formControlName="apellidos" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Edad</label>
        <input type="number" class="form-control" formControlName="edad" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Altura (cm)</label>
        <input type="number" class="form-control" formControlName="altura" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Posición</label>
        <select class="form-control" formControlName="posicion" required>
          <option value="" disabled>Selecciona una posición</option>
          <option value="Base">Base</option>
          <option value="Escolta">Escolta</option>
          <option value="Alero">Alero</option>
          <option value="Ala-Pivot">Ala-Pivot</option>
          <option value="Pivot">Pivot</option>
        </select>
      </div>

      <div class="col-md-12">
        <label class="form-label">Multimedia (URLs, separadas por coma)</label>
        <input type="text" class="form-control" formControlName="multimedia0" required>
      </div>

      <div class="col-md-12">
        <label class="form-label">ID de YouTube</label>
        <input type="text" class="form-control" formControlName="youtubeId" required>
      </div>

      <div class="col-md-12">
        <label class="form-label">Información</label>
        <textarea class="form-control" formControlName="info" rows="4" required></textarea>
      </div>
    </div>

    <!-- Botones -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancelar</button>
      <button type="submit" class="btn btn-primario" [disabled]="form.invalid">Guardar cambios</button>
    </div>
  </form>

  <!-- ========================== -->
  <!--  VISTA DETALLE (NO EDITAR) -->
  <!-- ========================== -->
  <div *ngIf="!editMode" class="card-content-scrollable">
    <div class="row">
      <div class="col-md-6 text-center">
        <img *ngIf="player" [src]="player.multimedia[0]" [alt]="player.nombre"
          class="img-fluid rounded shadow-sm"
          style="max-width: 220px; object-fit: cover; border: 2px solid var(--color-primario);" />
      </div>

      <div class="col-md-6">
        <p class="mb-2"><strong>Posición:</strong> {{ player.posicion }}</p>
        <p class="mb-2"><strong>Edad:</strong> {{ player.edad }} años</p>
        <p class="mb-2"><strong>Altura:</strong> {{ player.altura }} cm</p>
        <p class="mb-2"><strong>Información:</strong> {{ player.info }}</p>
      </div>
    </div>

    <div class="row text-center mt-4">
      <app-media [youtubeId]="player.youtubeId || ''"></app-media>
    </div>
  </div>
</div>
